services:
  db:
    image: postgres:16-alpine
    container_name: yukiverse-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: yukiverse
      POSTGRES_PASSWORD: yukiverse
      POSTGRES_DB: yukiverse
    ports:
      # Host port 5433 to avoid clashing with a PostgreSQL that is already
      # installed on the machine and listening on the default 5432.
      - "5433:5432"
    volumes:
      - yukiverse-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yukiverse -d yukiverse"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  yukiverse-pgdata:
